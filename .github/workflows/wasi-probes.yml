name: WASI feasibility probes
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: ${{ matrix.probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        probe: [jvm, baseline, guice-minimal, guice, c-baseline, c-runtime, c-reflection, c-guice-minimal, c-guice-compat, c-concurrency, c-guice-classlib]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Execute probe
        run: python scripts/run_probe.py ${{ matrix.probe }}
      - name: Preserve evidence including failed probes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasi-${{ matrix.probe }}
          path: |
            target/evidence/
            target/surefire-reports/
            target/wasi/
            target/c/
          if-no-files-found: warn
      - name: Report gate result
        if: always()
        run: |
          echo '### ${{ matrix.probe }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat target/evidence/${{ matrix.probe }}/result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
